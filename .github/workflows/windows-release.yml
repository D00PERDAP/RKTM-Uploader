name: Windows offline release
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  universal-x86:
    name: Unified x86 — Windows 7 SP1 and later
    runs-on: windows-2022
    env:
      RKTM_SIGNING_PFX_B64: ${{ secrets.RKTM_SIGNING_PFX_B64 }}
      RKTM_SIGNING_PFX_PASSWORD: ${{ secrets.RKTM_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'
      - name: Install compatible build tooling
        run: python -m pip install "pyinstaller==5.13.2" "pytest==7.4.4" "pillow==10.4.0"
      - name: Test, render screens and build unified application
        shell: pwsh
        run: ./build-windows.ps1
      - name: Sign application when a trusted certificate is configured
        if: ${{ env.RKTM_SIGNING_PFX_B64 != '' && env.RKTM_SIGNING_PFX_PASSWORD != '' }}
        shell: pwsh
        run: ./sign-windows.ps1
      - name: Install Windows 7 compatible Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.2.2 --yes --no-progress --allow-downgrade
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          python tools/capture_installer.py release/RKTM-Setup-5.0.1-x86.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer Unicode UI verification failed' }
      - name: Sign and verify installer
        if: ${{ env.RKTM_SIGNING_PFX_B64 != '' && env.RKTM_SIGNING_PFX_PASSWORD != '' }}
        shell: pwsh
        run: ./sign-windows.ps1 -Installer release/RKTM-Setup-5.0.1-x86.exe
      - name: Test silent install and packaged startup
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'RKTM-install-check'
          $install = Start-Process release/RKTM-Setup-5.0.1-x86.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Silent install failed' }
          $exe = Join-Path $installDir 'Uploader\RKTM-Uploader.exe'
          if (-not (Test-Path $exe)) { throw 'Installed application missing' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'РКТМ — Расписание.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Russian desktop shortcut name is corrupted' }
          $product = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{89DA7779-6E8E-44F1-9E8C-BB23FF136208}_is1'
          if ($product.DisplayName -ne 'РКТМ — Расписание') { throw 'Russian installed product name is corrupted' }
          foreach ($mode in @('', '--admin')) {
            if ($mode) { $app = Start-Process $exe -ArgumentList $mode -PassThru } else { $app = Start-Process $exe -PassThru }
            Start-Sleep -Seconds 4
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'Packaged UI did not open' }
            Stop-Process -Id $app.Id
          }
          $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Compute checksum
        shell: pwsh
        run: Get-FileHash release/RKTM-Setup-5.0.1-x86.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RKTM-5.0.1-Setup-x86
          path: release/*
      - uses: actions/upload-artifact@v4
        with:
          name: RKTM-5.0.1-real-screens
          path: previews/*.png
